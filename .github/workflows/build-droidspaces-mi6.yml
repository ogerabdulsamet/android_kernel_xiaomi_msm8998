name: Build Mi6 Kernel with Droidspaces + KernelSU Next

on:
  workflow_dispatch:
    inputs:
      ksu_branch:
        description: 'KernelSU Next branch'
        required: true
        default: 'legacy'
        type: choice
        options:
          - legacy
          - stable
          - dev
      use_kprobes:
        description: 'KProbes hooks? (false = manuel VFS, önerilen 4.4 için)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential ccache curl flex git kmod \
            libelf-dev libssl-dev lld llvm clang lz4 pahole \
            python3 rsync unzip zip zstd \
            gcc-arm-linux-gnueabi gcc-aarch64-linux-gnu

      - name: Clone Droidspaces repo
        run: |
          git clone --depth=1 https://github.com/ravindu644/Droidspaces-OSS.git /tmp/Droidspaces-OSS

      - name: Apply Droidspaces non-GKI patches
        run: |
          set -e

          PATCH_DIR="/tmp/Droidspaces-OSS/Documentation/resources/kernel-patches/non-GKI"

          for p in "$PATCH_DIR"/*.patch; do
            echo "Checking $p"

            if grep -q "net/netfilter/xt_qtaguid.c" "$p"; then
              if [ -f "net/netfilter/xt_qtaguid.c" ]; then
                echo "Applying xt_qtaguid patch: $p"
                patch -p1 < "$p"
              else
                echo "Skipping $p because net/netfilter/xt_qtaguid.c is not present in this kernel tree"
              fi
            else
              echo "Applying $p"
              patch -p1 < "$p"
            fi
          done

      # -------------------------------------------------------
      # KernelSU Next entegrasyonu
      # -------------------------------------------------------
      - name: Integrate KernelSU Next
        run: |
          echo ">>> KernelSU Next (${{ github.event.inputs.ksu_branch }}) ekleniyor..."
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s ${{ github.event.inputs.ksu_branch }}

          # KSU versiyonunu sonraki adımlar için kaydet
          KSU_VER=$(cat KernelSU/kernel/Makefile 2>/dev/null \
            | grep 'KERNELSU_VERSION' | head -1 | cut -d= -f2 | tr -d ' ' || echo "unknown")
          echo "KSU_VERSION=${KSU_VER}" >> $GITHUB_ENV
          echo ">>> KernelSU Next v${KSU_VER} eklendi."

      - name: Apply manual VFS hooks
        if: ${{ github.event.inputs.use_kprobes == 'false' }}
        run: |
          python3 << 'PYEOF'
          import os

          def patch_file(path, marker, extern_decl, call_code, before_line):
              if not os.path.exists(path):
                  print(f"  [MISS] {path} bulunamadı, atlanıyor.")
                  return
              with open(path, 'r') as f:
                  content = f.read()
              if 'CONFIG_KSU' in content:
                  print(f"  [SKIP] {path} zaten patch uygulanmış.")
                  return
              if marker not in content:
                  print(f"  [WARN] {path} içinde '{marker}' bulunamadı.")
                  return
              content = content.replace(marker, extern_decl + '\n' + marker, 1)
              if before_line and before_line in content:
                  content = content.replace(before_line, call_code + '\n' + before_line, 1)
              with open(path, 'w') as f:
                  f.write(content)
              print(f"  [OK]   {path}")

          # fs/exec.c
          patch_file(
              'fs/exec.c',
              'int do_execve(',
              '#ifdef CONFIG_KSU\n__attribute__((hot))\nextern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,\n\t\t\t\tvoid *argv, void *envp, int *flags);\n#endif',
              '#ifdef CONFIG_KSU\n\tksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);\n#endif',
              '\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);'
          )

          # fs/open.c
          patch_file(
              'fs/open.c',
              'SYSCALL_DEFINE3(faccessat,',
              '#ifdef CONFIG_KSU\n__attribute__((hot))\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,\n\t\t\t\tint *mode, int *flags);\n#endif',
              '#ifdef CONFIG_KSU\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif',
              '\tif (mode & ~S_IRWXO)'
          )

          # fs/read_write.c
          patch_file(
              'fs/read_write.c',
              'SYSCALL_DEFINE3(read,',
              '#ifdef CONFIG_KSU\nextern bool ksu_vfs_read_hook __read_mostly;\nextern __attribute__((cold)) int ksu_handle_sys_read(unsigned int fd,\n\t\t\t\tchar __user **buf_ptr, size_t *count_ptr);\n#endif',
              '#ifdef CONFIG_KSU\n\tif (unlikely(ksu_vfs_read_hook))\n\t\tksu_handle_sys_read(fd, &buf, &count);\n#endif',
              '\tif (f.file) {'
          )

          # fs/stat.c
          patch_file(
              'fs/stat.c',
              'SYSCALL_DEFINE4(newfstatat,',
              '#ifdef CONFIG_KSU\n__attribute__((hot))\nextern int ksu_handle_stat(int *dfd, const char __user **filename_user,\n\t\t\t\tint *flags);\n#endif',
              '#ifdef CONFIG_KSU\n\tksu_handle_stat(&dfd, &filename, &flag);\n#endif',
              '\terror = vfs_fstatat(dfd, filename, &stat, flag);'
          )

          # kernel/reboot.c
          patch_file(
              'kernel/reboot.c',
              'SYSCALL_DEFINE4(reboot,',
              '#ifdef CONFIG_KSU\nextern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n#endif',
              '#ifdef CONFIG_KSU\n\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n#endif',
              '\t/* We only trust the superuser with rebooting the system. */'
          )

          print("\nTüm VFS hook patch'leri tamamlandı.")
          PYEOF

      - name: Patch defconfig with KSU config
        run: |
          # Vendor config fragmenti veya ana defconfig — hangisi varsa ona ekle
          # Bu kernel vendor/xiaomi/sagit.config kullandığı için oraya ekliyoruz
          TARGET_CONFIG="arch/arm64/configs/vendor/xiaomi/sagit.config"
          if [ ! -f "$TARGET_CONFIG" ]; then
            TARGET_CONFIG="arch/arm64/configs/sagit_defconfig"
          fi

          # Eski KSU satırlarını temizle
          sed -i '/CONFIG_KSU/d' "$TARGET_CONFIG"
          sed -i '/CONFIG_KSU_KPROBE_HOOKS/d' "$TARGET_CONFIG"
          sed -i '/CONFIG_KPROBES=/d' "$TARGET_CONFIG"
          sed -i '/CONFIG_KPROBE_EVENTS=/d' "$TARGET_CONFIG"

          echo "" >> "$TARGET_CONFIG"
          echo "# KernelSU Next" >> "$TARGET_CONFIG"
          echo "CONFIG_KSU=y" >> "$TARGET_CONFIG"

          if [ "${{ github.event.inputs.use_kprobes }}" = "true" ]; then
            echo "CONFIG_KSU_KPROBE_HOOKS=y" >> "$TARGET_CONFIG"
            echo "CONFIG_KPROBES=y" >> "$TARGET_CONFIG"
            echo "CONFIG_KPROBE_EVENTS=y" >> "$TARGET_CONFIG"
            echo ">>> KPROBE hooks etkinleştirildi ($TARGET_CONFIG)"
          else
            echo "CONFIG_KSU_KPROBE_HOOKS=n" >> "$TARGET_CONFIG"
            echo ">>> Manuel VFS hooks aktif ($TARGET_CONFIG)"
          fi

      # -------------------------------------------------------
      # Orijinal adımlar (değiştirilmedi)
      # -------------------------------------------------------
      - name: Prepare config
        run: |
          mkdir -p out
          make O=out ARCH=arm64 vendor/xiaomi/mi8998_defconfig vendor/xiaomi/sagit.config droidspaces.config

      - name: Build kernel
        run: |
          make -j"$(nproc)" O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            Image.gz-dtb dtbs 2>&1 | tee build.log

          if [ ! -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "::error::Image.gz-dtb bulunamadı! Derleme başarısız."
            exit 1
          fi

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

      - name: Prepare flashable zip
        run: |
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3

          sed -i 's|kernel.string=.*|kernel.string=Mi6 Droidspaces + KSUNext v${{ env.KSU_VERSION }} by Abdulsamet|' anykernel.sh
          sed -i 's|do.devicecheck=.*|do.devicecheck=1|' anykernel.sh
          sed -i 's|device.name1=.*|device.name1=sagit|' anykernel.sh
          sed -i '/device.name2=/d' anykernel.sh
          sed -i '/device.name3=/d' anykernel.sh
          sed -i '/device.name4=/d' anykernel.sh
          sed -i 's|BLOCK=.*|BLOCK=boot;|' anykernel.sh
          sed -i 's|IS_SLOT_DEVICE=.*|IS_SLOT_DEVICE=0;|' anykernel.sh

          ZIP_NAME="Mi6-Droidspaces-KSUNext-v${{ env.KSU_VERSION }}-$(date +%Y%m%d).zip"
          zip -r9 "../${ZIP_NAME}" . -x ".git*" "README.md" "*placeholder"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: Mi6-Droidspaces-KSUNext-ZIP
          path: |
            ${{ env.ZIP_NAME }}
            out/.config

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 3
