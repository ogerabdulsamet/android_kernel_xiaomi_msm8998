name: Build Mi6 Kernel with Droidspaces + KSUNext ZIP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential ccache curl flex git kmod \
            libelf-dev libssl-dev lld llvm clang lz4 pahole \
            python3 rsync unzip zip zstd \
            gcc-arm-linux-gnueabi gcc-aarch64-linux-gnu

      - name: Clone Droidspaces repo
        run: |
          git clone --depth=1 https://github.com/ravindu644/Droidspaces-OSS.git /tmp/Droidspaces-OSS

      - name: Apply Droidspaces non-GKI patches
        run: |
          set -e
          PATCH_DIR="/tmp/Droidspaces-OSS/Documentation/resources/kernel-patches/non-GKI"

          for p in "$PATCH_DIR"/*.patch; do
            echo "Checking $p"
            if grep -q "net/netfilter/xt_qtaguid.c" "$p"; then
              if [ -f "net/netfilter/xt_qtaguid.c" ]; then
                echo "Applying xt_qtaguid patch: $p"
                patch -p1 < "$p"
              else
                echo "Skipping $p because net/netfilter/xt_qtaguid.c is not present in this kernel tree"
              fi
            else
              echo "Applying $p"
              patch -p1 < "$p"
            fi
          done

      - name: Integrate KernelSU Next (pinned)
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/v3.0.0/kernel/setup.sh" | bash -s v3.0.0

      - name: Backport path_umount for pre-5.9 kernels
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("fs/namespace.c")
          text = p.read_text()

          if "int path_umount(struct path *path, int flags)" in text:
              print("path_umount already present, skipping")
              raise SystemExit(0)

          anchor = "/*\n * Now umount can handle mount points as well as block devices.\n"
          insert = r'''
          static int can_umount(const struct path *path, int flags)
          {
          	struct mount *mnt = real_mount(path->mnt);

          	if (flags & ~(MNT_FORCE | MNT_DETACH | MNT_EXPIRE | UMOUNT_NOFOLLOW))
          		return -EINVAL;
          	if (!may_mount())
          		return -EPERM;
          	if (path->dentry != path->mnt->mnt_root)
          		return -EINVAL;
          	if (!check_mnt(mnt))
          		return -EINVAL;
          	if (mnt->mnt.mnt_flags & MNT_LOCKED)
          		return -EINVAL;
          	if (flags & MNT_FORCE && !capable(CAP_SYS_ADMIN))
          		return -EPERM;
          	return 0;
          }

          int path_umount(struct path *path, int flags)
          {
          	struct mount *mnt = real_mount(path->mnt);
          	int ret;

          	ret = can_umount(path, flags);
          	if (!ret)
          		ret = do_umount(mnt, flags);

          	dput(path->dentry);
          	mntput_no_expire(mnt);
          	return ret;
          }

          '''
          if anchor not in text:
              raise SystemExit("Anchor not found in fs/namespace.c; patch manually needed")
          text = text.replace(anchor, insert + "\n" + anchor, 1)
          p.write_text(text)
          print("Injected path_umount into fs/namespace.c")
          PY

      - name: Patch KSUNext for 4.4 API compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("drivers/kernelsu/allowlist.c")
          text = p.read_text()

          text = text.replace(
              "kernel_write(fp, &magic, sizeof(magic), &off)",
              "kernel_write(fp, (const char *)&magic, sizeof(magic), &off)"
          )
          text = text.replace(
              "kernel_write(fp, &version, sizeof(version), &off)",
              "kernel_write(fp, (const char *)&version, sizeof(version), &off)"
          )
          text = text.replace(
              "kernel_write(fp, &p->profile, sizeof(p->profile), &off);",
              "kernel_write(fp, (const char *)&p->profile, sizeof(p->profile), &off);"
          )

          if "#ifndef TWA_RESUME" not in text:
              marker = "#include <linux/task_work.h>"
              compat = '#include <linux/task_work.h>\\n#ifndef TWA_RESUME\\n#define TWA_RESUME 0\\n#endif'
              if marker in text:
                  text = text.replace(marker, compat, 1)
              else:
                  text = "#ifndef TWA_RESUME\\n#define TWA_RESUME 0\\n#endif\\n" + text

          p.write_text(text)
          print("Patched drivers/kernelsu/allowlist.c for legacy 4.4 API compatibility")
          PY

      - name: Prepare config
        run: |
          mkdir -p out
          make O=out ARCH=arm64 vendor/xiaomi/mi8998_defconfig vendor/xiaomi/sagit.config droidspaces.config

      - name: Enable KSU + KPROBES if missing
        run: |
          {
            grep -q '^CONFIG_KSU=' out/.config || echo 'CONFIG_KSU=y'
            grep -q '^CONFIG_KPROBES=' out/.config || echo 'CONFIG_KPROBES=y'
            grep -q '^CONFIG_HAVE_KPROBES=' out/.config || echo 'CONFIG_HAVE_KPROBES=y'
            grep -q '^CONFIG_KPROBE_EVENTS=' out/.config || echo 'CONFIG_KPROBE_EVENTS=y'
          } >> out/.config
          make O=out ARCH=arm64 olddefconfig

      - name: Build kernel
        run: |
          make -j"$(nproc)" O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            Image.gz-dtb dtbs

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

      - name: Prepare flashable zip
        run: |
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3

          sed -i 's|kernel.string=.*|kernel.string=Mi6 Droidspaces + KSUNext Kernel by Abdulsamet|' anykernel.sh
          sed -i 's|do.devicecheck=.*|do.devicecheck=1|' anykernel.sh
          sed -i 's|device.name1=.*|device.name1=sagit|' anykernel.sh
          sed -i '/device.name2=/d' anykernel.sh
          sed -i '/device.name3=/d' anykernel.sh
          sed -i '/device.name4=/d' anykernel.sh
          sed -i 's|BLOCK=.*|BLOCK=boot;|' anykernel.sh
          sed -i 's|IS_SLOT_DEVICE=.*|IS_SLOT_DEVICE=0;|' anykernel.sh

          zip -r9 ../Mi6-Droidspaces-Kernel-KSUNext.zip . -x ".git*" "README.md" "*placeholder"

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: Mi6-Droidspaces-Kernel-KSUNext-ZIP
          path: |
            Mi6-Droidspaces-Kernel-KSUNext.zip
            out/.config
