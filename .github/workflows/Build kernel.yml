name: Build Mi 6 Kernel with KernelSU Next

on:
  workflow_dispatch:
    inputs:
      ksu_branch:
        description: 'KernelSU Next branch (legacy / stable / dev)'
        required: true
        default: 'legacy'
        type: choice
        options:
          - legacy
          - stable
          - dev
      use_kprobes:
        description: 'Use KPROBES hooks? (false = manuel VFS hooks, önerilen)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      kernel_branch:
        description: 'Kernel branch'
        required: true
        default: 'lineage-23.2'

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ARCH: arm64
      SUBARCH: arm64
      DEFCONFIG: sagit_defconfig
      CLANG_VERSION: r416183b   # Clang 12 — 4.4 kernellerle uyumlu
      CROSS_COMPILE: aarch64-linux-android-
      CROSS_COMPILE_ARM32: arm-linux-androideabi-
      KERNEL_DIR: kernel_source
      OUT_DIR: out
      ANYKERNEL_DIR: anykernel

    steps:
      # -------------------------------------------------------
      # 1. Bağımlılıkları kur
      # -------------------------------------------------------
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates curl flex \
            git gnupg gzip libelf-dev libssl-dev libncurses-dev \
            lz4 make python3 unzip wget zip

      # -------------------------------------------------------
      # 2. Kernel kaynak kodunu indir
      # -------------------------------------------------------
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: Nanhumly-Staging/android_kernel_xiaomi_msm8998
          ref: ${{ github.event.inputs.kernel_branch }}
          path: ${{ env.KERNEL_DIR }}
          fetch-depth: 1

      # -------------------------------------------------------
      # 3. Clang toolchain'i indir (Google Android Clang)
      # -------------------------------------------------------
      - name: Download Clang toolchain
        run: |
          mkdir -p clang
          wget -q --show-progress \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-${{ env.CLANG_VERSION }}.tar.gz" \
            -O clang.tar.gz || \
          wget -q --show-progress \
            "https://github.com/kdrag0n/proton-clang/releases/download/20210522/proton-clang-20210522.tar.zst" \
            -O clang.tar.zst
          # tar.gz veya tar.zst olabilir — hangisi indiyse aç
          if [ -f clang.tar.gz ]; then
            tar -xzf clang.tar.gz -C clang
          elif [ -f clang.tar.zst ]; then
            sudo apt-get install -y zstd
            tar --use-compress-program=unzstd -xf clang.tar.zst -C clang --strip-components=1
          fi
          echo "CLANG_PATH=$(pwd)/clang/bin" >> $GITHUB_ENV

      # -------------------------------------------------------
      # 4. GCC cross-compile toolchain'lerini indir
      # -------------------------------------------------------
      - name: Download GCC toolchains
        run: |
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 \
            gcc64
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 \
            gcc32
          echo "GCC64_PATH=$(pwd)/gcc64/bin" >> $GITHUB_ENV
          echo "GCC32_PATH=$(pwd)/gcc32/bin" >> $GITHUB_ENV

      # -------------------------------------------------------
      # 5. KernelSU Next'i entegre et
      # -------------------------------------------------------
      - name: Integrate KernelSU Next
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          echo ">>> KernelSU Next (${{ github.event.inputs.ksu_branch }}) ekleniyor..."
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s ${{ github.event.inputs.ksu_branch }}
          echo "KSU_VERSION=$(cat KernelSU/kernel/Makefile | grep 'KERNELSU_VERSION' | cut -d= -f2 | tr -d ' ')" >> $GITHUB_ENV

      # -------------------------------------------------------
      # 6. Defconfig'e KSU ayarlarını ekle
      # -------------------------------------------------------
      - name: Patch defconfig with KSU config
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          DEFCONFIG_PATH="arch/arm64/configs/${{ env.DEFCONFIG }}"

          # Eski KSU satırlarını temizle
          sed -i '/CONFIG_KSU/d' "$DEFCONFIG_PATH"
          sed -i '/CONFIG_KSU_KPROBE_HOOKS/d' "$DEFCONFIG_PATH"

          echo "" >> "$DEFCONFIG_PATH"
          echo "# KernelSU Next" >> "$DEFCONFIG_PATH"
          echo "CONFIG_KSU=y" >> "$DEFCONFIG_PATH"

          if [ "${{ github.event.inputs.use_kprobes }}" = "true" ]; then
            echo "CONFIG_KSU_KPROBE_HOOKS=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_KPROBES=y" >> "$DEFCONFIG_PATH"
            echo "CONFIG_KPROBE_EVENTS=y" >> "$DEFCONFIG_PATH"
            echo ">>> KPROBE hooks etkinleştirildi."
          else
            echo "CONFIG_KSU_KPROBE_HOOKS=n" >> "$DEFCONFIG_PATH"
            echo ">>> Manuel VFS hooks kullanılacak."
          fi

      # -------------------------------------------------------
      # 7. Manuel VFS hook patch'lerini uygula (kprobe=false ise)
      # -------------------------------------------------------
      - name: Apply manual VFS hooks
        if: ${{ github.event.inputs.use_kprobes == 'false' }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          python3 << 'PYEOF'
          import re

          def patch_file(path, marker, extern_decl, call_code, before_line=None):
              with open(path, 'r') as f:
                  content = f.read()
              # Zaten patch uygulanmışsa atla
              if 'CONFIG_KSU' in content:
                  print(f"  [SKIP] {path} zaten patch uygulanmış.")
                  return
              # extern bildirimi: marker'dan önce ekle
              content = content.replace(marker, extern_decl + '\n' + marker, 1)
              # çağrıyı: before_line'dan hemen önce ekle
              if before_line:
                  content = content.replace(before_line, call_code + '\n' + before_line, 1)
              with open(path, 'w') as f:
                  f.write(content)
              print(f"  [OK]   {path} patch uygulandı.")

          # --- fs/exec.c ---
          patch_file(
              'fs/exec.c',
              'int do_execve(',
              '''#ifdef CONFIG_KSU
__attribute__((hot))
extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,
\t\t\t\tvoid *argv, void *envp, int *flags);
#endif''',
              '''#ifdef CONFIG_KSU
\tksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);
#endif''',
              before_line='\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);'
          )

          # --- fs/open.c ---
          patch_file(
              'fs/open.c',
              'SYSCALL_DEFINE3(faccessat,',
              '''#ifdef CONFIG_KSU
__attribute__((hot))
extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,
\t\t\t\tint *mode, int *flags);
#endif''',
              '''#ifdef CONFIG_KSU
\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);
#endif''',
              before_line='\tif (mode & ~S_IRWXO)'
          )

          # --- fs/read_write.c ---
          patch_file(
              'fs/read_write.c',
              'SYSCALL_DEFINE3(read,',
              '''#ifdef CONFIG_KSU
extern bool ksu_vfs_read_hook __read_mostly;
extern __attribute__((cold)) int ksu_handle_sys_read(unsigned int fd,
\t\t\t\tchar __user **buf_ptr, size_t *count_ptr);
#endif''',
              '''#ifdef CONFIG_KSU
\tif (unlikely(ksu_vfs_read_hook))
\t\tksu_handle_sys_read(fd, &buf, &count);
#endif''',
              before_line='\tif (f.file) {'
          )

          # --- fs/stat.c ---
          patch_file(
              'fs/stat.c',
              'SYSCALL_DEFINE4(newfstatat,',
              '''#ifdef CONFIG_KSU
__attribute__((hot))
extern int ksu_handle_stat(int *dfd, const char __user **filename_user,
\t\t\t\tint *flags);
#endif''',
              '''#ifdef CONFIG_KSU
\tksu_handle_stat(&dfd, &filename, &flag);
#endif''',
              before_line='\terror = vfs_fstatat(dfd, filename, &stat, flag);'
          )

          # --- kernel/reboot.c ---
          patch_file(
              'kernel/reboot.c',
              'SYSCALL_DEFINE4(reboot,',
              '''#ifdef CONFIG_KSU
extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);
#endif''',
              '''#ifdef CONFIG_KSU
\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);
#endif''',
              before_line='\t/* We only trust the superuser with rebooting the system. */'
          )

          print("Tüm VFS hook patch'leri tamamlandı.")
          PYEOF

      # -------------------------------------------------------
      # 8. Kernel'i derle
      # -------------------------------------------------------
      - name: Build kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          export PATH="${{ env.CLANG_PATH }}:${{ env.GCC64_PATH }}:${{ env.GCC32_PATH }}:$PATH"

          mkdir -p ${{ env.OUT_DIR }}

          # Defconfig oluştur
          make O=${{ env.OUT_DIR }} \
            ARCH=${{ env.ARCH }} \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=${{ env.CROSS_COMPILE }} \
            CROSS_COMPILE_ARM32=${{ env.CROSS_COMPILE_ARM32 }} \
            ${{ env.DEFCONFIG }}

          # Derleme
          make -j$(nproc) \
            O=${{ env.OUT_DIR }} \
            ARCH=${{ env.ARCH }} \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=${{ env.CROSS_COMPILE }} \
            CROSS_COMPILE_ARM32=${{ env.CROSS_COMPILE_ARM32 }} \
            2>&1 | tee ../build.log

          # Çıktıyı kontrol et
          if [ ! -f "${{ env.OUT_DIR }}/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "::error::Kernel Image.gz-dtb bulunamadı! Derleme başarısız."
            exit 1
          fi
          echo ">>> Derleme başarılı!"

      # -------------------------------------------------------
      # 9. AnyKernel3 ile flashable ZIP oluştur
      # -------------------------------------------------------
      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 \
            https://github.com/KernelSU-Next/AnyKernel3 \
            ${{ env.ANYKERNEL_DIR }}

          cp ${{ env.KERNEL_DIR }}/${{ env.OUT_DIR }}/arch/arm64/boot/Image.gz-dtb \
            ${{ env.ANYKERNEL_DIR }}/

          # anykernel.sh'ı Mi 6 (sagit) için ayarla
          sed -i 's/device\.name1=.*/device.name1=sagit/' ${{ env.ANYKERNEL_DIR }}/anykernel.sh
          sed -i 's/device\.name2=.*/device.name2=Mi6/' ${{ env.ANYKERNEL_DIR }}/anykernel.sh

          cd ${{ env.ANYKERNEL_DIR }}
          ZIP_NAME="Mi6-KSUNext-${{ env.KSU_VERSION }}-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "../${ZIP_NAME}" . -x '*.git*' README.md
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo ">>> ZIP oluşturuldu: ${ZIP_NAME}"

      # -------------------------------------------------------
      # 10. Artifact olarak yükle
      # -------------------------------------------------------
      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 7

      - name: Upload build log (hata varsa incele)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 3
